name: bio103-fieldnotes

services:
  bio103:
    # BIO103_IMAGE_TAG selects a retained image for rollback (see deployment/README.md).
    image: bio103-fieldnotes:${BIO103_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bio103-fieldnotes-app
    restart: unless-stopped
    ports:
      - "3103:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

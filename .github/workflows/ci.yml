name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Content, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every note, card, question and model answer must be literal slide text, and every
      # question must be fair. Standard library only; the lecture files are not needed.
      - name: Validate course content
        run: python3 scripts/validate_course.py > validation.json && python3 -c "import json; d=json.load(open('validation.json')); print(d['status'], d['assertions'], 'assertions')"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Health check
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3103/api/health && exit 0; sleep 1; done
          echo "server did not become healthy" >&2
          exit 1

# Included from /data/nginx/custom/http.conf inside Nginx Proxy Manager.
# This host is reached through the existing Cloudflare Tunnel.
server {
    listen 80;
    listen [::]:80;
    server_name bio103.giggly.store.cv;

    # Cloudflare preserves the visitor's scheme in X-Forwarded-Proto.
    # Checking that header avoids a redirect loop for tunnel HTTPS traffic.
    if ($http_x_forwarded_proto = http) {
        return 301 https://$host$request_uri;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $bio103_origin http://bio103-fieldnotes:3000;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass $bio103_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
